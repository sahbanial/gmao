services:
  postgres:
    image: postgres:16-alpine
    container_name: gmao-postgres
    environment:
      POSTGRES_USER: gmao
      POSTGRES_PASSWORD: gmao
      POSTGRES_DB: gmao
    ports:
      - "5433:5432"
    volumes:
      - gmao_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmao -d gmao"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: gmao-api
    image: gmao-api:latest
    environment:
      DATABASE_URL: postgresql://gmao:gmao@postgres:5432/gmao?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: gmao-web:latest
    container_name: gmao-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gmao_pg:

